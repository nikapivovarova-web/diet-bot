name: integration-postgres

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-postgres:
    name: integration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: diet_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diet_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DIET_BOT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diet_bot_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency lock tooling
        run: python -m pip install -r requirements/lock-tools.txt
      - name: Verify dependency locks
        run: |
          python -m piptools compile requirements/lock-tools.in --resolver=backtracking --strip-extras --no-header --no-emit-index-url --allow-unsafe --output-file="$RUNNER_TEMP/lock-tools.txt"
          python -m piptools compile pyproject.toml --resolver=backtracking --strip-extras --no-header --no-emit-index-url --output-file="$RUNNER_TEMP/prod.txt"
          python -m piptools compile pyproject.toml --resolver=backtracking --strip-extras --extra=dev --no-header --no-emit-index-url --output-file="$RUNNER_TEMP/dev.txt"
          python scripts/check_dependency_locks.py requirements/lock-tools.txt "$RUNNER_TEMP/lock-tools.txt" --allow-extra colorama
          python scripts/check_dependency_locks.py requirements/prod.txt "$RUNNER_TEMP/prod.txt" --allow-extra colorama --allow-extra tzdata
          python scripts/check_dependency_locks.py requirements/dev.txt "$RUNNER_TEMP/dev.txt" --allow-extra colorama --allow-extra tzdata
      - name: Install package and test dependencies from lock
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q -p no:cacheprovider -m postgres_integration tests/test_postgres_runtime_preflight.py tests/test_postgres_entitlement_store.py tests/test_postgres_payment_store.py tests/test_postgres_weekly_pdf_job_store.py tests/test_postgres_chat_state_store.py tests/test_postgres_one_day_generation_job_store.py
      - name: Run entitlement JSON migration tests
        run: python -m pytest -q -p no:cacheprovider tests/test_entitlement_json_migration.py
      - name: Run storage runtime safety tests
        run: python -m pytest -q -p no:cacheprovider tests/test_runtime_config.py tests/test_healthcheck.py tests/test_entitlement_storage.py
