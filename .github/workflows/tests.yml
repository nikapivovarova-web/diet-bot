name: tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency lock tooling
        run: python -m pip install -r requirements/lock-tools.txt
      - name: Verify dependency locks
        run: |
          python -m piptools compile requirements/lock-tools.in --resolver=backtracking --strip-extras --no-header --no-emit-index-url --allow-unsafe --output-file=requirements/lock-tools.txt
          python -m piptools compile pyproject.toml --resolver=backtracking --strip-extras --no-header --no-emit-index-url --output-file=requirements/prod.txt
          python -m piptools compile pyproject.toml --resolver=backtracking --strip-extras --extra=dev --no-header --no-emit-index-url --output-file=requirements/dev.txt
          git diff --exit-code -- requirements/lock-tools.txt requirements/prod.txt requirements/dev.txt
      - name: Install package and dev dependencies from lock
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Import package smoke
        run: python -c "import diet_bot; import diet_bot.healthcheck; import diet_bot.production_preflight"
      - name: Run pytest
        run: python -m pytest -q -p no:cacheprovider
      - name: Runtime healthcheck smoke
        env:
          DIET_BOT_TOKEN: fake-token-for-ci
        run: python -m diet_bot.healthcheck
