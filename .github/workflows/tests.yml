name: tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q -p no:cacheprovider
      - name: Runtime healthcheck smoke
        env:
          DIET_BOT_TOKEN: fake-token-for-ci
        run: python -m diet_bot.healthcheck
