[project]
name = "telegram-diet-bot"
version = "0.1.0"
description = "Telegram diet bot MVP with deterministic nutrition planning core."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

