[project]
name = "telegram-diet-bot"
version = "0.1.0"
description = "Telegram diet bot MVP with deterministic nutrition planning core."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "openai>=1.0.0",
    "reportlab>=4.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
diet-bot-telegram = "diet_bot.telegram_app:main"
diet-bot-healthcheck = "diet_bot.healthcheck:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pypdf>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "postgres_integration: tests that require DIET_BOT_TEST_DATABASE_URL and a reachable PostgreSQL database",
]
