[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-diet-bot"
version = "0.1.0"
description = "Telegram diet bot MVP with deterministic nutrition planning core."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.27.0",
    "psycopg[binary]>=3.1.0",
    "reportlab>=4.0.0",
]

[project.scripts]
diet-bot-telegram = "diet_bot.telegram_app:main"

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pypdf>=4.0.0",
]

[tool.setuptools.package-data]
diet_bot = [
    "data/*.json",
    "data/*.png",
    "data/recipe_photos/*.jpg",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow_pdf_builder: long-running recipe and PDF builder checks split into a non-PR CI job",
    "postgres_integration: live PostgreSQL storage and JSON migration checks",
]
